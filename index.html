<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Segundo Cerebro</title>
  <meta name="description" content="Mi panel personal: apartamento, trabajo, skills, gimnasio y documentos.">
  <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cerebro">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="login" hidden></div>
  <div id="app" hidden>
    <aside class="side">
      <div class="brand">Segundo Cerebro</div>
      <nav id="nav" aria-label="Secciones"></nav>
    </aside>
    <div class="content">
      <header class="top">
        <h1 id="titulo">Inicio</h1>
        <div class="top-r">
          <span id="modo" class="pill"></span>
          <button id="respaldo" class="btn ghost small" title="Descargar todos tus registros en JSON">Respaldo</button>
          <button id="salir" class="btn ghost small">Salir</button>
        </div>
      </header>
      <main id="main"></main>
    </div>
    <button id="fab" class="fab" aria-label="Nuevo registro">+</button>
  </div>
  <dialog id="dlg"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
